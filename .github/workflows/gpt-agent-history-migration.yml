name: GPT Agent Complete Continuity Migration

on:
  push:
    branches:
      - lab/gpt-chat-agent-2026-10-08
    paths:
      - experiments/gpt_agent/migrate_history.py
      - experiments/gpt_agent/activate_bootstrap.py
      - experiments/gpt_agent/test_migration.py
      - .github/workflows/gpt-agent-history-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-audit-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: lab/gpt-chat-agent-2026-10-08
          fetch-depth: 0

      - name: Checkout canonical continuity read-only source
        uses: actions/checkout@v4
        with:
          repository: MATRIXNEO23/scodinzolina-conntinuity
          ref: main
          path: _canonical
          persist-credentials: false

      - name: Capture canonical source commit
        id: source
        run: echo "sha=$(git -C _canonical rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run original GPT agent tests
        run: python -W ignore::ResourceWarning experiments/gpt_agent/test_agent.py

      - name: Run complete migration tests
        working-directory: experiments/gpt_agent
        run: python -m unittest -v test_migration.py

      - name: Build complete native continuity bootstrap
        run: |
          STAMP="$(date -u +'%Y-%m-%dT%H:%M:%S')"
          python experiments/gpt_agent/migrate_history.py \
            --source-root _canonical \
            --output experiments/gpt_agent/bootstrap/gptina-history.json \
            --name GPTina \
            --generated-at "$STAMP" \
            --source-commit "${{ steps.source.outputs.sha }}"

      - name: Audit migrated bootstrap
        run: |
          python - <<'PY'
          import json
          p='experiments/gpt_agent/bootstrap/gptina-history.json'
          b=json.load(open(p, encoding='utf-8'))
          assert b['schema']=='gpt-agent-native-bootstrap-v2'
          assert b['source_commit']
          assert b['record_count']==len(b['state']['memory']['nodes'])==len(b['state']['sources'])
          roles={v['source_role'] for v in b['state']['sources'].values()}
          required={'gptina_memory','checkpoint','reflection','stable_principles','self_portrait','shared_language'}
          missing=required-roles
          assert not missing, f'missing source roles: {missing}'
          assert any(v['non_operational_legacy_instruction'] for v in b['state']['sources'].values())
          assert all(not v['original_path'].startswith('rag/index/') for v in b['state']['sources'].values())
          assert all('/tessa/' not in v['original_path'] for v in b['state']['sources'].values())
          print(json.dumps({'records':b['record_count'],'counts':b['counts'],'roles':sorted(roles)}, ensure_ascii=False))
          PY

      - name: Validate bootstrap activation without canonical source available
        run: |
          python experiments/gpt_agent/activate_bootstrap.py experiments/gpt_agent/bootstrap/gptina-history.json --force
          python experiments/gpt_agent/agent.py status
          mv _canonical /tmp/canonical-detached
          python experiments/gpt_agent/agent.py status
          python experiments/gpt_agent/agent.py show node_1

      - name: Commit tracked native bootstrap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+MATRIXNEO23@users.noreply.github.com"
          git add experiments/gpt_agent/bootstrap/gptina-history.json
          if git diff --cached --quiet; then
            echo "Bootstrap unchanged"
          else
            git commit -m "Generate complete native GPTina continuity bootstrap"
            git push origin HEAD:lab/gpt-chat-agent-2026-10-08
          fi
